<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: var(--vscode-font-family);
        font-size: var(--vscode-font-size);
        line-height: 1.55;
        color: var(--vscode-foreground);
        background: var(--vscode-editor-background);
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px 24px 40px;
      }

      /* Header */

      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 16px 0;
        margin-bottom: 20px;
        color: var(--vscode-descriptionForeground);
        border-bottom: 1px solid var(--vscode-editorWidget-border);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .header::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--vscode-textLink-foreground);
      }

      .explanation-content {
        font-size: 14px;
      }

      {{markdownStyles}}

      /* Error */

      .error {
        margin-top: 16px;
        padding: 10px 12px;
        border: 1px solid var(--vscode-inputValidation-errorBorder);
        border-radius: 4px;
        color: var(--vscode-errorForeground);
        background: var(--vscode-inputValidation-errorBackground);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <span>Good Buddy</span>
      </div>

      <main id="out" class="explanation-content markdown-content"></main>

      <div id="error"></div>
    </div>

    <script>
      const out = document.getElementById("out");
      const error = document.getElementById("error");

      out.textContent = "Waiting for explanation...";

      window.addEventListener("message", (event) => {
        const msg = event.data;
        switch (msg.type) {
          case "vsc:error":
            error.innerHTML = "";

            const errorElement = document.createElement("div");
            errorElement.className = "error";
            errorElement.textContent = "Error: " + msg.text;

            error.appendChild(errorElement);
            break;

          case "vsc:done":
            out.innerHTML = msg.text;
            break;
        }
      });
    </script>
  </body>
</html>
