<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src ${cspSource}; style-src ${cspSource} 'nonce-${nonce}'; script-src ${cspSource} 'nonce-${nonce}';"
    />
    <link rel="stylesheet" href="${styleUri}" />
    <style nonce="${nonce}">
      .attach-icon {
        mask-image: url("${addIconUri}");
        -webkit-mask-image: url("${addIconUri}");
      }
      .send-icon {
        mask-image: url("${sendIconUri}");
        -webkit-mask-image: url("${sendIconUri}");
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script nonce="${nonce}" type="module" src="${scriptUri}"></script>
  </body>
</html>
